name: CI/CD Pipeline — SecuroFi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Test & Build Assets
  # ─────────────────────────────────────────────
  build-and-test:
    name: 🧪 Test & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip, gd
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-dev-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-dev-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Upload Built Assets
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build/
          retention-days: 1

      - name: Copy Environment File
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          sed -i 's/APP_ENV=production/APP_ENV=testing/' .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations (SQLite in-memory)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan migrate --force

      - name: Run Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
          APP_ENV: testing
        run: php artisan test

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to Production via FTP
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production (FTP)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Assets
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: public/build/

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip, gd

      - name: Cache Composer Dependencies (Production)
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-prod-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-prod-

      - name: Install Production Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/*.log
            **/.env
            **/.env.*
            **/storage/logs/**
            **/*.zip
            **/*.sql
            **/README.md
            **/PRD*.md
            **/STAGING*.md
            **/HOSTING*.md
            **/phpunit.xml
            **/.phpunit*
            **/Thumbs.db
            **/.DS_Store
            **/create_production_zip.php
            **/*.ps1

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | ${{ secrets.FTP_SERVER }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Remember to run migrations manually via phpMyAdmin if schema changed." >> $GITHUB_STEP_SUMMARY
